[package]
name = "tx-builder-server"
version = "0.1.0"
edition = "2021"

[dependencies]
protocol = { path = "../protocol/gen" }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
once_cell = "1.17"
serde_json = "1.0"
dotenvy = "0.15"
tx3-sdk = "0.9.2"
reqwest = "0.13.1"
log = "0.4"
pretty_env_logger = "0.5.0"

